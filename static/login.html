<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>muse-proxy</title>
<link rel="stylesheet" href="/app.css?v=20261106o" />
</head>
<body>
<div class="login-wrap">
  <form class="login" id="f" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg></div>
    <h1>muse-proxy</h1>
    <p>Muse 反代 · 管理后台登录</p>
    <label class="f">用户名</label>
    <input type="text" id="u" name="username" value="admin" autocomplete="username" />
    <label class="f">密码</label>
    <input type="password" id="p" name="password" autocomplete="current-password" autofocus />
    <div class="err" id="e"></div>
    <button class="btn primary block" id="b" type="submit">登 录</button>
    <a class="oss" href="https://github.com/lichao199208/muse2api" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>开源地址</a>
  </form>
</div>
<script>
fetch('/api/me').then(r => { if (r.ok) location.replace('/'); });
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) location.replace('/');
    else e.textContent = d.error || (d.detail && (d.detail.error || d.detail.message)) || '登录失败';
  } catch (x) { e.textContent = String(x); }
  b.disabled = false;
});
</script>
</body>
</html>
